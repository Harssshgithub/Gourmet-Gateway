kind = "web"
previewPath = "/"
title = "Amrithya — The Eternal Dining"
version = "1.0.0"
id = "artifacts/amrithya"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21419

[services.development]
run = "pnpm --filter @workspace/amrithya run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/amrithya", "run", "build" ]
publicDir = "artifacts/amrithya/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21419"
BASE_PATH = "/"
